spring.application.name=BusyBee

# ── HTTPS / TLS ────────────────────────────────────────────────────────────────
# Keystore is a PKCS12 file generated with:
#   keytool -genkeypair -alias busybee -keyalg RSA -keysize 2048 \
#           -storetype PKCS12 -keystore busybee.p12 -validity 3650
# Store the file OUTSIDE the repository (or add *.p12 to .gitignore).
#
# Keystore PASSWORD must be supplied via OS environment variable – NEVER hardcoded:
#   export KEYSTORE_PASSWORD=yourSecretPassword
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:busybee.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=busybee
# Password read from the OS environment variable – NOT stored in this file
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# ── Session cookie ─────────────────────────────────────────────────────────────
# HttpOnly  – JS cannot read it (blocks XSS session hijacking)
# Secure    – sent only over HTTPS
# SameSite  – Strict blocks CSRF from cross-origin requests
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Strict
server.servlet.session.cookie.name=BUSYBEE_SESSION

# ── Multipart file upload limits ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.securefromscratch=INFO
